services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SQLITE_DB_PATH: /data/sqlite/webapp_filmes.db
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend-data:
